<!DOCTYPE html>
<html lang="es">
<head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <meta http-equiv="X-UA-Compatible" content="ie=edge">
        <link rel="stylesheet" type="text/css" href="style.css">
        <title>Fantasia Fatal VII</title>
        <script src="jquery-3.3.1.js"></script>
        <script src="Personaje.js"></script>
        <script>
                $(document).ready(function () {
                        initGame();
                });
        </script>
</head>
<body>
        <div class="shell">
                <header>
                        <h1>Fantasia Fatal VII</h1>
                        <h2>Batalla final</h2>
                </header>
                <section id="battlefield">
                        <div id="divMonster" class="card"></div>
                        <div id="contenedorpj"></div>
                </section>
                <section id="panel">
                        <div id="log" class="card"></div>
                        <div id="turnos" class="card">
                                <h3>Turnos e iniciativa</h3>
                                <div class="control-ronda">
                                        <span>Ronda</span>
                                        <div class="stepper">
                                                <button type="button" id="btnRondaMenos" aria-label="Disminuir ronda">-</button>
                                                <span id="contadorRonda">1</span>
                                                <button type="button" id="btnRondaMas" aria-label="Aumentar ronda">+</button>
                                        </div>
                                </div>
                                <div class="control-turno">
                                        <button type="button" id="btnAvanzarTurno" class="primary">Siguiente turno</button>
                                        <button type="button" id="btnRecalcularIniciativa" class="pill">Recalcular iniciativa</button>
                                </div>
                                <div id="iniciativa"></div>
                        </div>
                        <div id="efectos" class="card">
                                <h3>Recursos y efectos</h3>
                                <div class="control-efecto">
                                        <span>Efecto en curso</span>
                                        <div class="stepper">
                                                <button type="button" id="btnEfectoMenos" aria-label="Restar rondas de efecto">-</button>
                                                <span id="contadorEfecto">0 rondas</span>
                                                <button type="button" id="btnEfectoMas" aria-label="Sumar rondas de efecto">+</button>
                                        </div>
                                        <small>Úsalo para concentraciones o temporizadores rápidos.</small>
                                </div>
                                <div class="notas">
                                        <label for="campoNotas">Notas del DM</label>
                                        <textarea id="campoNotas" rows="5" placeholder="Pistas, objetivos, recursos, música..."></textarea>
                                </div>
                        </div>
                        <button id="btnReiniciar" type="button" class="primary">Reiniciar partida</button>
                </section>
        </div>
</body>
</html>

<!DOCTYPE html>
<html>
<head>
        <title>Fantasia Fatal VII</title>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <link rel="stylesheet" type="text/css" href="style.css">
        <script src="jquery-3.3.1.js"></script>
        <script src="Personaje.js"></script>
        <script>
                $(document).ready(function () {
                        $("#subJugar").click(almacenarNJug);
                });
        </script>
</head>
<body>
        <div class="shell">
                <h1>Fantasia Fatal VII</h1>
                <p>Selecciona cuántos héroes quieres llevar a la batalla final.</p>
                <form action="juego.html" class="card">
                        <label for="inpNumPj">Número de jugadores (1-4):</label>
                        <input type="number" name="inpNumPj" id="inpNumPj" placeholder="de 1 a 4 Jugadores" min="1" max="4" value="1">
                        <input type="submit" id="subJugar" value="Jugar">
                </form>
        </div>
</body>
</html>
